name: CI

# Minimal by design: one interpreter, PyPy, on pushes to main and on pull requests. The tests need
# no ROMs (the board streams are committed); the judge ROMs run on the boards.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: pypy3.11
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
