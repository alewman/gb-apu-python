[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gb-apu-python"
version = "0.1.0.dev0"
description = "Readable, pure-Python Game Boy APU core (DMG, CGB and the GBA's Game Boy channels), extracted from gameboy-python"
readme = "README.md"
# The floor is the newest Python PyPy supports (3.11 as of PyPy 7.3.x); raise it when PyPy does.
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "alewman" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: System :: Emulators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/alewman/gb-apu-python"
Repository = "https://github.com/alewman/gb-apu-python"
Issues = "https://github.com/alewman/gb-apu-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Pinned: `ruff format --check` must see the formatter the tree was formatted with.
    "ruff==0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gb_apu_python"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PERF", "RUF"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
# The mutants are exact source lines, kept whole so each reads as the line it breaks.
"scripts/mutation.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["gb_apu_python"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
pythonpath = ["src", "tests", "scripts"]
